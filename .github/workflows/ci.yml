name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push supersedes an in-flight run on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functions:
    name: Cloud Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci
        working-directory: functions

      - name: Typecheck
        run: npm run typecheck
        working-directory: functions

      - name: Unit tests
        run: npm test
        working-directory: functions

      # The emulator is a Java process.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Runs the real triggers and callables against a real Firestore. This is
      # where the loop guards are proven — each of these handlers writes back to
      # the document that triggered it.
      - name: Integration tests
        run: npm run test:integration
        working-directory: functions

  rules:
    name: Firestore security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: rules-tests/package-lock.json

      # The Firestore emulator is a Java process.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: npm ci
        working-directory: rules-tests

      # Proves the guarantee the product depends on: neither partner can commit
      # on the other's behalf.
      - name: Rules tests
        run: npm test
        working-directory: rules-tests

  design-tokens:
    name: Design tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No dependencies — the validator is plain Node.
      - name: Validate tokens
        run: node design/validate-tokens.mjs

      # The usage table in the design system doc is generated. If regenerating
      # it produces a diff, the doc is out of date with the tokens.
      - name: Check the generated usage table is current
        run: |
          node design/gen-usage-table.mjs
          if ! git diff --quiet -- docs/MovieMate-Design-System.md; then
            echo "::error::The colour usage table is stale. Run 'node design/gen-usage-table.mjs' and commit."
            git diff -- docs/MovieMate-Design-System.md
            exit 1
          fi

  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AGP 8.7 targets JDK 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      # The google-services plugin refuses to configure without this file. The
      # placeholder is fake throughout, so the resulting build cannot reach
      # Firebase — it only proves the code compiles.
      - name: Provide placeholder Firebase config
        run: cp android/app/google-services.ci.json android/app/google-services.json

      # TMDB_ACCESS_TOKEN is read into BuildConfig. Empty is fine for a compile;
      # TmdbApi checks for blank at call time and fails loudly rather than
      # sending an unauthenticated request.
      - name: Compile and lint
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug lintDebug

      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: moviemate-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # Lint and test reports are the only way to see what happened on a red run.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/**
          if-no-files-found: ignore
