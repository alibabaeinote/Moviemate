name: Deploy web (Firebase Hosting + Firestore rules)

# Deploy only this project branch. GitHub Actions authenticates to Google Cloud
# with Workload Identity Federation; no long-lived service account key or
# FIREBASE_SERVICE_ACCOUNT GitHub secret is needed.
on:
  push:
    branches: ["claude/movie-matching-suggestion-w6ot7v"]
    paths:
      - "web/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "firebase.json"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/134216388127/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-deploy@moviemate-prod-2026.iam.gserviceaccount.com

      - name: Deploy Firestore rules and Hosting
        run: |
          npx firebase-tools@latest deploy \
            --only firestore:rules,hosting \
            --project moviemate-prod-2026 \
            --non-interactive
